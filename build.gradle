plugins {
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'java'
    id 'maven-publish'
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    implementation 'org.springframework.boot:spring-boot-starter-actuator:4.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-web:4.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf:4.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-validation:4.1.0'
    runtimeOnly 'org.springframework.boot:spring-boot-devtools:4.1.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:4.1.0'

    // JSP support
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper:11.0.22'

    // Jackson for ObjectMapper
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
}


group = 'springboot-jsp-login-app'
version = '0.0.1-SNAPSHOT'
description = 'springboot-jsp-login-app'

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
